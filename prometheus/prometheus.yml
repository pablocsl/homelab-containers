global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["<ruta-prometheus>"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["<ruta-node-exporter>"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["<ruta-cadvisor>"]
