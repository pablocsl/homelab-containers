services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - <port>:3000
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=<grafana-user>
      - GF_SECURITY_ADMIN_PASSWORD=<grafana-passwd>

volumes:
  grafana_data:
